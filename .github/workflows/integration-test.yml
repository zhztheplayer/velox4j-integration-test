name: Integration Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '**/*'
  push:
    branches:
      - 'main'
    paths:
      - '**/*'
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [
          "ubuntu:22.04",
          "ubuntu:24.04",
          "ubuntu:25.04",
          "debian:12",
          "fedora:39",
          "fedora:40",
          "fedora:41",
          "centos:stream9",
          "rockylinux:9",
          "almalinux:9",
          "oraclelinux:9",
          "amazonlinux:2023"
        ]
    steps:
      - uses: actions/checkout@v4
      - name: Download Toolchains
        run: |
          bash .github/script/test/download-tools.sh
      - name: Run Tests
        run: |
          docker run -v ${{ github.workspace }}:/work -w /work ${{ matrix.image }} bash -c "
            bash .github/script/test/run-test.sh
          "
